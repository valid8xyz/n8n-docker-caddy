services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - caddy_data:/data
    - ${DATA_FOLDER}/caddy_config:/config
    - ${DATA_FOLDER}/caddy_config/Caddyfile:/etc/caddy/Caddyfile
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.27
    restart: always
    ports:
    - 5678:5678
    environment:
    - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=false
    - N8N_ENCRYPTION_KEY=9De1FECwUbY2e1wCXHubpTQ
    - DB_TYPE=postgresdb
    - DB_TABLE_PREFIX=n8n_
    - DB_POSTGRESDB_DATABASE=n8n_db
    - DB_POSTGRESDB_HOST=${YOUR_DROPLET_IP}
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=n8n_user
    - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
    - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false
    - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - NODE_ENV=production
    - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    - NODE_FUNCTION_ALLOW_EXTERNAL=*
    - NODE_FUNCTION_ALLOW_BUILTIN=*
    - EXECUTIONS_DATA_PRUNE=true
    - EXECUTIONS_DATA_MAX_AGE=90
    - EXECUTIONS_DATA_PRUNE_MAX_COUNT=25000
    volumes:
    - n8n_data:/home/node/.n8n
    - ${DATA_FOLDER}/local_files:/files
    - npm_data:/usr/local/lib/node_modules
  voice-gemini-bridge:
    build: ./voice-bridge
    restart: unless-stopped
    env_file: ./voice-bridge/.env
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  pp-service:
    build: ./pp-service
    restart: unless-stopped
    env_file: ./pp-service/.env
    dns:
    - 8.8.8.8
    - 1.1.1.1
    expose:
    - '8088'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8088/health
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  awa-service:
    build: ./awa-service
    restart: unless-stopped
    env_file: ./awa-service/.env
    dns:
    - 8.8.8.8
    - 1.1.1.1
    expose:
    - '8089'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8089/health
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  bc-video-pipeline:
    build: ./bc-video-pipeline
    restart: unless-stopped
    env_file: ./bc-video-pipeline/.env
    dns:
    - 8.8.8.8
    - 1.1.1.1
    volumes:
    - /data/bcvideo-jobs:/data/bcvideo-jobs
    - /data/ytdlp-cache:/root/.cache/yt-dlp
    expose:
    - '8087'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8087/health
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    expose:
    - '3000'
    volumes:
    - ${DATA_FOLDER}/waha_data:/app/.sessions
    shm_size: 256m
    environment:
    - WHATSAPP_API_PORT=3000
    - WHATSAPP_API_KEY=${WAHA_API_KEY}
    - WHATSAPP_HOOK_URL=https://ezhadcvilceruaaxibyx.supabase.co/functions/v1/msg-inbound-message-ingest?source=waha
    - WHATSAPP_HOOK_EVENTS=message,session.status
    - NODE_OPTIONS=--max-old-space-size=512
    - WAHA_DISABLE_PUPPETEER_SANDBOX=false
    - PUPPETEER_ARGS=--disable-dev-shm-usage,--no-first-run,--no-zygote
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - '--header=X-Api-Key: saeBAttCeY3dstE5Ss8CyMLLvPRyVFl3nh1pQG1valQ'
      - http://127.0.0.1:3000/api/sessions
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data:
    external: true
  n8n_data:
    external: true
  npm_data:
    external: true
